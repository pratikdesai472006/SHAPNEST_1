; ===============================================================================
; PlatformIO Project Configuration for SHAPNEST Phase 1 Prototype
; Physical Node Targets (Fan, Iron, Door) + Wristband + Central Hub Gateway
; ===============================================================================

[platformio]
default_envs = node_fan, node_iron, node_door, wristband

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
extra_scripts = 
    pre:scripts/set_src.py
    post:scripts/fix_link.py
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; -----------------------------------------------------------------------------
; PHYSICAL NODE 1: ESP32-C3 Fan Proximity Anchor (Node ID 1)
; -----------------------------------------------------------------------------
[env:node_fan]
board = esp32-c3-devkitm-1
custom_src_dir = firmware/node_fan
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I firmware/node_fan
    -I firmware/common
    -I protocol

; -----------------------------------------------------------------------------
; PHYSICAL NODE 2: ESP32-C3 Iron Proximity Anchor (Node ID 2)
; -----------------------------------------------------------------------------
[env:node_iron]
board = esp32-c3-devkitm-1
custom_src_dir = firmware/node_iron
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I firmware/node_iron
    -I firmware/common
    -I protocol

; -----------------------------------------------------------------------------
; PHYSICAL NODE 3: ESP32-C3 Door Proximity Anchor (Node ID 3)
; -----------------------------------------------------------------------------
[env:node_door]
board = esp32-c3-devkitm-1
custom_src_dir = firmware/node_door
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I firmware/node_door
    -I firmware/common
    -I protocol

; -----------------------------------------------------------------------------
; WRISTBAND: ESP32-C3 Child Wristband Scanner & Primary Distance Engine
; -----------------------------------------------------------------------------
[env:wristband]
board = esp32-c3-devkitm-1
custom_src_dir = firmware/wristband
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I firmware/wristband
    -I protocol

