; ===============================================================================
; PlatformIO Project Configuration for SHAPNEST Phase 1 Prototype
; ===============================================================================

[platformio]
default_envs = node_esp32c3, wristband_esp32c3, central_hub_esp32wroom

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
extra_scripts = 
    pre:scripts/set_src.py
    post:scripts/fix_link.py
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; -----------------------------------------------------------------------------
; ENVIRONMENT 1: ESP32-C3 Proximity Anchor Node
; -----------------------------------------------------------------------------
[env:node_esp32c3]
board = esp32-c3-devkitm-1
custom_src_dir = firmware/node_esp32c3
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I firmware/node_esp32c3
    -I protocol

; -----------------------------------------------------------------------------
; ENVIRONMENT 2: ESP32-C3 Child Wristband Scanner & Telemetry Uplink
; -----------------------------------------------------------------------------
[env:wristband_esp32c3]
board = esp32-c3-devkitm-1
custom_src_dir = firmware/wristband_esp32c3
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I firmware/wristband_esp32c3
    -I protocol

; -----------------------------------------------------------------------------
; ENVIRONMENT 3: ESP32-WROOM-32 Central Hub Receiver & Serial Bridge
; -----------------------------------------------------------------------------
[env:central_hub_esp32wroom]
board = esp32dev
custom_src_dir = firmware/central_hub_esp32wroom
build_flags =
    -I firmware/central_hub_esp32wroom
    -I protocol

